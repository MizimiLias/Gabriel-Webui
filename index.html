<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/brand/gabriel-avatar.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#F7F4EC"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#111820"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="Gabriel, a personal AI companion with persistent conversations."
    />
    <title>Gabriel Agent</title>
    <script>
      try {
        const saved = localStorage.getItem('gabriel.theme')
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme =
          saved === 'dark' || (saved !== 'light' && dark) ? 'dark' : 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
